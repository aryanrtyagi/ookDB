
services:
  - type: web
    name: arydb-api
    runtime: python
    region: singapore
    plan: 1c-2g

    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r backend/requirements.txt
      python -m pip install --no-deps .
      python backend/manage.py collectstatic --noinput

    startCommand: |
      cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120

    healthCheckPath: /api/health/

    disk:
      name: arydb-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: ARYDB_DATA_DIR
        value: /var/data/arydb

      - key: DJANGO_DB_PATH
        value: /var/data/django.sqlite3
